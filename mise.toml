# Tools and tasks for working on this repo. This is not the global mise
# config, which lives in home/dot-config/mise/config.toml.
#
# Formatter output changes between versions, so the versions are pinned here
# and CI, the agent hook and `mise run` all use the same ones.

[tools]
lua-language-server = "3.19.2"
"npm:oxfmt" = "0.79.0"
rumdl = "0.3.5"
shellcheck = "0.11.0"
shfmt = "3.14.1"
stylua = "2.6.0"

[tasks.fmt]
description = "Format every file a formatter covers, and fix what rumdl can"
run = [
  # Before oxfmt, so oxfmt formats what rumdl's fixes leave.
  "rumdl fmt $(git ls-files '*.md')",
  "oxfmt .",
  "stylua $(git ls-files '*.lua')",
  # tests/shell_files.sh finds the shell scripts, by extension or first line.
  "shfmt -ln zsh -i 2 -w $(tests/shell_files.sh zsh)",
  "shfmt -i 2 -w $(tests/shell_files.sh sh)",
]

[tasks.lint]
description = "Check formatting and run ShellCheck and rumdl, without changing anything"
run = [
  "oxfmt --check .",
  "stylua --check $(git ls-files '*.lua')",
  # tests/shell_files.sh finds the shell scripts, by extension or first line.
  "shfmt -ln zsh -i 2 -d $(tests/shell_files.sh zsh)",
  "shfmt -i 2 -d $(tests/shell_files.sh sh)",
  "shellcheck $(tests/shell_files.sh sh)",
  "rumdl check $(git ls-files '*.md')",
]

[tasks.test]
description = "Syntax checks and tests; touches only temp directories"
run = [
  # The syntax of every shell script, then every tests/*_test.* script.
  # dot has to work on the bash macOS ships, so bash runs as /bin/bash.
  "tests/run_tests.sh",
  "nvim -l home/dot-config/nvim-shared/tests/query_spec.lua </dev/null",
]

[tasks.lua]
description = "What lua-language-server reports; needs Neovim and its plugins installed"
run = "tests/lua_check.sh"

[tasks.nvim]
description = "Start Neovim with this config in an empty home, as a new machine does"
run = "tests/nvim_start.sh"

[tasks.tools]
description = "Install the global mise config's tools into a temp directory; downloads about 1.5 GB"
run = "tests/tools_check.sh"

# Leaves out `tools`, which CI also runs, because of how much it downloads.
[tasks.check]
description = "Lint, tests, Lua diagnostics and a Neovim start"
depends = ["lint", "test", "lua", "nvim"]
