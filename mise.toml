# Tools and tasks for working on this repo. This is not the global mise
# config, which lives in home/dot-config/mise/config.toml.
#
# Formatter output changes between versions, so the versions are pinned here
# and CI, the agent hook and `mise run` all use the same ones.

[tools]
lua-language-server = "3.19.2"
"npm:oxfmt" = "0.78.0"
rumdl = "0.3.4"
shellcheck = "0.11.0"
shfmt = "3.14.1"
stylua = "2.6.0"

[tasks.fmt]
description = "Format every file a formatter covers"
run = [
  "oxfmt .",
  "stylua $(git ls-files '*.lua')",
  "shfmt -ln zsh -i 2 -w home/dot-zshrc home/dot-local/share/zsh/site-functions/_dot home/dot-config/zsh/dotfiles-prompt.zsh tests/dot_prompt_test.zsh",
  "shfmt -i 2 -w home/dot-local/bin/dot $(git ls-files '*.sh' '*.bash')",
]

[tasks.lint]
description = "Check formatting and run ShellCheck and rumdl, without changing anything"
run = [
  "oxfmt --check .",
  "stylua --check $(git ls-files '*.lua')",
  "shfmt -ln zsh -i 2 -d home/dot-zshrc home/dot-local/share/zsh/site-functions/_dot home/dot-config/zsh/dotfiles-prompt.zsh tests/dot_prompt_test.zsh",
  "shfmt -i 2 -d home/dot-local/bin/dot $(git ls-files '*.sh' '*.bash')",
  "shellcheck home/dot-local/bin/dot $(git ls-files '*.sh' '*.bash')",
  "rumdl check $(git ls-files '*.md')",
]

[tasks.test]
description = "Syntax checks and tests; touches only temp directories"
run = [
  # dot has to work on the bash macOS ships, so always test with /bin/bash.
  "/bin/bash -n home/dot-local/bin/dot",
  "zsh -n home/dot-zshrc",
  "zsh -n home/dot-config/zsh/dotfiles-prompt.zsh",
  "zsh -n tests/dot_prompt_test.zsh",
  "/bin/bash tests/dot_test.bash",
  "zsh tests/dot_prompt_test.zsh",
  "nvim -l home/dot-config/nvim-shared/tests/query_spec.lua </dev/null",
]

[tasks.lua]
description = "What lua-language-server reports; needs Neovim and its plugins installed"
run = "tests/lua_check.sh"

[tasks.tools]
description = "Install the global mise config's tools into a temp directory; downloads about 1.5 GB"
run = "tests/tools_check.sh"

# Leaves out `tools`, which CI also runs, because of how much it downloads.
[tasks.check]
description = "Lint, tests and Lua diagnostics"
depends = ["lint", "test", "lua"]
