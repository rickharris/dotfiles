name: check

on:
  push:
    branches: [main]
  pull_request:

# Three jobs so the checks list on a pull request shows which kind of thing
# failed. Each only calls a mise task; what they run is defined in mise.toml.
jobs:
  lint:
    # Formatting and ShellCheck need nothing from macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the tools pinned in mise.toml.
      - uses: jdx/mise-action@v5

      - name: Formatting and ShellCheck
        run: mise run lint

  test:
    # dot targets macOS and the bash it ships, so the tests run there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Install stow and neovim
        run: brew install stow neovim

      - name: Syntax and tests
        run: mise run test

  lua:
    # lua-language-server reads Neovim's runtime and the plugins' type
    # annotations. .luarc.json says where they are on a machine set up by
    # dot, so this job puts them in the same places.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      # The version every machine gets, from the global mise config.
      - name: Install Neovim with mise
        run: mise install "neovim@$(mise config get -f home/dot-config/mise/config.toml tools.neovim)"

      - name: Fetch the Neovim plugins
        run: tests/fetch_nvim_plugins.sh "$HOME/.local/share/nvim/site/pack/core/opt"

      - name: Lua diagnostics
        run: mise run lua
