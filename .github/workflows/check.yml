name: check

on:
  push:
    branches: [main]
  pull_request:

# Two jobs so the checks list on a pull request shows which kind of thing
# failed. Both only call mise tasks; what they run is defined in mise.toml.
jobs:
  lint:
    # Formatting and ShellCheck need nothing from macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the tools pinned in mise.toml.
      - uses: jdx/mise-action@v5

      - name: Formatting and ShellCheck
        run: mise run lint

  test:
    # dot targets macOS and the bash it ships, so the tests run there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Install stow and neovim
        run: brew install stow neovim

      # lua-language-server reads the plugins' type annotations.
      - name: Fetch the Neovim plugins
        run: tests/fetch_nvim_plugins.sh "$RUNNER_TEMP/nvim-plugins"

      - name: Syntax, tests and Lua diagnostics
        run: LUA_CHECK_PLUGINS="$RUNNER_TEMP/nvim-plugins" mise run test
