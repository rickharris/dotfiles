name: check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the formatters pinned in mise.toml.
      - uses: jdx/mise-action@v5

      - name: Install stow and neovim
        run: brew install stow neovim

      - name: Formatting, syntax and tests
        run: mise run check
