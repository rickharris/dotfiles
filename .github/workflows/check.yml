name: check

on:
  push:
    branches: [main]
  pull_request:

# Five jobs so the checks list on a pull request shows which kind of thing
# failed. Each only calls a mise task; what they run is defined in mise.toml.
jobs:
  lint:
    # Formatting and ShellCheck need nothing from macOS.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Installs the tools pinned in mise.toml.
      - uses: jdx/mise-action@v5

      - name: Formatting and ShellCheck
        run: mise run lint

  test:
    # dot targets macOS and the bash it ships, so the tests run there.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Install stow
        run: brew install stow

      # The version every machine gets, not whichever one Homebrew has. It is
      # not in this repo's mise.toml, so tell mise which version `nvim` means
      # for the steps that follow.
      - name: Install Neovim with mise
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          version=$(mise config get -f home/dot-config/mise/config.toml tools.neovim)
          mise install "neovim@$version"
          echo "MISE_NEOVIM_VERSION=$version" >> "$GITHUB_ENV"

      - name: Syntax and tests
        run: mise run test

  lua:
    # lua-language-server reads Neovim's runtime and the plugins' type
    # annotations. .luarc.json says where they are on a machine set up by
    # dot, so this job puts them in the same places.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      # The version every machine gets, from the global mise config. mise
      # asks GitHub's API for the release, and without a token that request
      # shares the runner's rate limit and can be refused with a 403.
      - name: Install Neovim with mise
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise install "neovim@$(mise config get -f home/dot-config/mise/config.toml tools.neovim)"

      - name: Fetch the Neovim plugins
        run: tests/fetch_nvim_plugins.sh "$HOME/.local/share/nvim/site/pack/core/opt"

      - name: Lua diagnostics
        run: mise run lua

  nvim:
    # The lua job only reads the config. This one runs it: Neovim starts in
    # an empty home, installs the plugins from the lockfile, builds the
    # parsers and runs the build hooks, on the platform the machines run.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      - name: Install Neovim with mise
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise install "neovim@$(mise config get -f home/dot-config/mise/config.toml tools.neovim)"

      # nvim-treesitter builds parsers with it.
      - name: Install the tree-sitter CLI
        run: brew install tree-sitter-cli

      - name: Start Neovim
        run: mise run nvim

  tools:
    # mise vets an npm package only when it installs one, so a version bump
    # in the global mise config can pass the other jobs and still stop
    # `dot install`. This installs every tool from scratch, on the platform
    # the machines run.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      - uses: jdx/mise-action@v5

      # mise asks GitHub's API for several of the releases, and without a
      # token those requests share the runner's rate limit.
      - name: Install the global tools from scratch
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: mise run tools
