[tools]
node = "lts"
neovim = "0.12.6"
deno = "latest"

# Language servers, formatters and linters for Neovim. These are the default
# versions; a project's own mise.toml overrides them inside that project, and
# Neovim picks that up because it runs tools through mise's shims.
#
# mise checks npm packages before installing them, and refuses three of these
# without an exemption. Two have under 1000 weekly downloads. Copilot depends
# on GitHub's SDK packages, which stopped carrying provenance at 1.0.17 after
# earlier releases had it (github/copilot-sdk#2894). They are still published
# by GitHub's own workflow, so the one SDK version this Copilot release uses
# is exempted, for every platform because mise checks them all. A Copilot
# update that brings a new SDK version needs these six lines updated with it.
"npm:@github/copilot-language-server" = { version = "1.570.0", trust_policy_excludes = [
  "@github/copilot-sdk-darwin-arm64@1.0.28",
  "@github/copilot-sdk-darwin-x64@1.0.28",
  "@github/copilot-sdk-linux-arm64@1.0.28",
  "@github/copilot-sdk-linux-x64@1.0.28",
  "@github/copilot-sdk-win32-arm64@1.0.28",
  "@github/copilot-sdk-win32-x64@1.0.28",
] }
"npm:@stylelint/language-server" = { version = "1.2.0", allow_low_downloads = true }
"npm:@vtsls/language-server" = "0.3.0"
"npm:bash-language-server" = "5.8.1"
"npm:cssmodules-language-server" = { version = "1.5.2", allow_low_downloads = true }
"npm:graphql-language-service-cli" = "4.0.1"
"npm:oxfmt" = "0.78.0"
"npm:oxlint" = "1.93.0"
"npm:prettier" = "3.10.1"
"npm:vscode-langservers-extracted" = "4.10.0"
lua-language-server = "3.19.2"
marksman = "2026-02-08"
rumdl = "0.3.4"
shellcheck = "0.11.0"
shfmt = "3.14.1"
stylua = "2.6.0"
taplo = "0.10.0"

[settings]
node.corepack = true
idiomatic_version_file_enable_tools = ["node"]
